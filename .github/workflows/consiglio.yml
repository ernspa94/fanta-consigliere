name: Aggiorna consiglio formazione

on:
  schedule:
    # Ogni 15 minuti: pianifica.py decide se serve ricalcolare (ricalcoli chiesti dall'app,
    # sempre nelle 8 ore prima della scadenza, altrimenti ogni 2 ore di giorno).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      codice:
        description: "Solo questa squadra (lo usa il pulsante Ricalcola dell'app)"
        type: string
        default: ""
      prova:
        description: "Manda solo una notifica di prova"
        type: boolean
        default: false
      programmato:
        description: "Giro programmato (lo manda Supabase ogni 15 minuti): decide pianifica.py se ricalcolare"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # solo per "Tieni acceso il giro programmato"

concurrency:
  group: consiglio
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  PUSH_ISCRIZIONI: ${{ secrets.PUSH_ISCRIZIONI }}
  # Arriva da fuori (pulsante Ricalcola): si usa solo come variabile, mai dentro il comando.
  CODICE: ${{ inputs.codice }}
  PROGRAMMATO: ${{ inputs.programmato }}

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Tieni acceso il giro programmato
        # GitHub spegne i giri programmati dopo 60 giorni senza attività nel repository (d'estate, o se
        # il calcolo si rompe e non arrivano più commit). Riattivarlo una volta al giorno azzera il conto.
        if: github.event_name == 'schedule' || inputs.programmato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gh workflow enable consiglio.yml -R "$GITHUB_REPOSITORY" || echo "Riattivazione non riuscita"
          fi

      - name: Serve ricalcolare?
        id: piano
        working-directory: engine
        run: |
          if [ "${{ inputs.prova }}" = "true" ]; then echo "esegui=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 -m fanta.pianifica

      - name: Notifica di prova
        if: inputs.prova
        working-directory: engine
        run: |
          pip install -q pywebpush
          python -m fanta.notifiche --prova ${CODICE:+"$CODICE"}

      - name: Voti delle giornate già scaricati (per le presenze recenti dell'asta)
        if: steps.piano.outputs.esegui == 'true'
        uses: actions/cache@v4
        with:
          path: data/voti
          key: voti-${{ github.run_id }}
          restore-keys: voti-

      - uses: actions/setup-python@v5
        if: steps.piano.outputs.esegui == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Installa dipendenze
        if: steps.piano.outputs.esegui == 'true'
        run: pip install -r requirements.txt

      - name: Test
        if: steps.piano.outputs.esegui == 'true'
        working-directory: engine
        run: python -m pytest -q tests

      - name: Calcola i consigli e manda le notifiche
        if: steps.piano.outputs.esegui == 'true'
        working-directory: engine
        run: python -m fanta.consiglia ${CODICE:+--codice "$CODICE"}

      - name: Salva i dati pubblici se sono cambiati
        if: steps.piano.outputs.esegui == 'true'
        run: |
          # Listone e orari della giornata (i consigli delle squadre stanno su Supabase).
          if [ -z "$(git status --porcelain output)" ]; then
            echo "Nessuna novità."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git commit -m "Dati giornata $(jq .giornata output/giornata.json) aggiornati"
          git pull --rebase -q && git push
