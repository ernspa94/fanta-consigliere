name: Aggiorna consiglio formazione

on:
  schedule:
    # Ogni 15 minuti: pianifica.py decide se serve ricalcolare
    # (sempre nelle 8 ore prima della scadenza, altrimenti ogni 2 ore di giorno).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      prova:
        description: "Manda solo una notifica di prova"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: consiglio
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Serve ricalcolare?
        id: piano
        working-directory: engine
        run: |
          if [ "${{ inputs.prova }}" = "true" ]; then echo "esegui=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 -m fanta.pianifica

      - name: Notifica di prova
        if: inputs.prova
        working-directory: engine
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_ISCRIZIONI: ${{ secrets.PUSH_ISCRIZIONI }}
        run: |
          pip install -q pywebpush
          python -m fanta.notifiche --prova

      - uses: actions/setup-python@v5
        if: steps.piano.outputs.esegui == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Installa dipendenze
        if: steps.piano.outputs.esegui == 'true'
        run: pip install -r requirements.txt

      - name: Test
        if: steps.piano.outputs.esegui == 'true'
        working-directory: engine
        run: python -m pytest -q tests

      - name: Calcola il consiglio
        if: steps.piano.outputs.esegui == 'true'
        working-directory: engine
        run: |
          git show HEAD:output/consiglio.json > /tmp/precedente.json 2>/dev/null || : > /tmp/precedente.json
          python -m fanta.consiglia

      - name: Manda le notifiche
        if: steps.piano.outputs.esegui == 'true'
        working-directory: engine
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_ISCRIZIONI: ${{ secrets.PUSH_ISCRIZIONI }}
        run: python -m fanta.notifiche /tmp/precedente.json

      - name: Salva se è cambiato qualcosa
        if: steps.piano.outputs.esegui == 'true'
        run: |
          # consiglia.py non riscrive i file se è cambiato solo l'orario di aggiornamento.
          if [ -z "$(git status --porcelain output)" ]; then
            echo "Nessuna novità."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git commit -m "Consiglio giornata $(jq .giornata output/consiglio.json) aggiornato"
          git push
